<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" width="700" height="424" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Box thinking vs arrow thinking</title>
  <desc id="d">Two panels. Left, box thinking: search, inventory and pricing as three separate boxes with no lines between them. Right, arrow thinking: the same three boxes joined, with an arrow from search to inventory labelled consult and an arrow from inventory to pricing. Footer: Interoperability is the goal, not accuracy.</desc>
  <defs>
    <marker id="ha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="hm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker>
  </defs>
  <rect width="700" height="424" fill="#fafaf7"/>
  <line x1="350" y1="24" x2="350" y2="350" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Left: box thinking -->
  <text x="175" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Box thinking</text>
  <rect x="95" y="76" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="175" y="112" text-anchor="middle" font-size="22" fill="#222">search</text>
  <rect x="95" y="184" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="175" y="220" text-anchor="middle" font-size="22" fill="#222">inventory</text>
  <rect x="95" y="292" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="175" y="328" text-anchor="middle" font-size="22" fill="#222">pricing</text>

  <!-- Right: arrow thinking -->
  <text x="525" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Arrow thinking</text>
  <rect x="445" y="76" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="525" y="112" text-anchor="middle" font-size="22" fill="#222">search</text>
  <rect x="445" y="184" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="525" y="220" text-anchor="middle" font-size="22" fill="#222">inventory</text>
  <rect x="445" y="292" width="160" height="56" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="525" y="328" text-anchor="middle" font-size="22" fill="#222">pricing</text>
  <line x1="525" y1="134" x2="525" y2="182" stroke="#d9480f" stroke-width="2.5" marker-end="url(#ha)"/>
  <text x="539" y="166" font-size="22" font-weight="600" fill="#b93c08">consult</text>
  <line x1="525" y1="242" x2="525" y2="290" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#hm)"/>

  <!-- Footer -->
  <text x="350" y="396" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Interoperability is the goal, not accuracy.</text>
</svg>
