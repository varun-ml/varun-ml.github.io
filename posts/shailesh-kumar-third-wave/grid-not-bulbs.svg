<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 596" width="700" height="596" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The grid, not the bulbs</title>
  <desc id="d">Two panels. Top, labelled 'use cases': bulbs, solar panels, transformers, switches and wires as five separate icons with nothing joining them. Bottom, labelled 'the grid': a mesh of nodes in two rows, linked straight and crosswise across three columns labelled production, distribution and consumption, with appliances connected only at consumption. Footer: 'The grid is important, not the use cases.'</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9480f"/>
    </marker>
    <marker id="ahk" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="700" height="596" fill="#fafaf7"/>

  <!-- Top panel: use cases, unconnected -->
  <rect x="24" y="24" width="652" height="256" rx="10" fill="none" stroke="#8a8f98" stroke-width="2.5"/>
  <text x="48" y="60" font-size="22" font-weight="600" fill="#5f646d">use cases</text>

  <g stroke="#8a8f98" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bulb -->
    <g transform="translate(133,100)">
      <circle cx="0" cy="0" r="18"/>
      <path d="M-8 16 v12 h16 v-12"/>
      <line x1="-8" y1="34" x2="8" y2="34"/>
    </g>
    <!-- solar panel -->
    <g transform="translate(350,104)">
      <path d="M-30 -18 h64 l-8 34 h-64 z"/>
      <line x1="2" y1="-18" x2="-6" y2="16"/>
      <line x1="-34" y1="-1" x2="30" y2="-1"/>
      <line x1="-6" y1="16" x2="-6" y2="30"/>
    </g>
    <!-- transformer -->
    <g transform="translate(567,104)">
      <rect x="-24" y="-22" width="48" height="44" rx="10"/>
      <path d="M-12 -13 q7 4 0 9 q7 4 0 9 q7 4 0 9"/>
      <path d="M12 -13 q-7 4 0 9 q-7 4 0 9 q-7 4 0 9"/>
    </g>
    <!-- switch -->
    <g transform="translate(241,214)">
      <circle cx="-24" cy="0" r="5"/>
      <circle cx="24" cy="0" r="5"/>
      <line x1="-20" y1="-3" x2="18" y2="-22"/>
    </g>
    <!-- wire -->
    <g transform="translate(458,206)">
      <path d="M-32 6 c11 -26 21 26 32 0 s21 -26 32 0"/>
    </g>
  </g>
  <text x="133" y="164" text-anchor="middle" font-size="22" fill="#222">bulbs</text>
  <text x="350" y="164" text-anchor="middle" font-size="22" fill="#222">solar panels</text>
  <text x="567" y="164" text-anchor="middle" font-size="22" fill="#222">transformers</text>
  <text x="241" y="258" text-anchor="middle" font-size="22" fill="#222">switches</text>
  <text x="458" y="258" text-anchor="middle" font-size="22" fill="#222">wires</text>

  <!-- Bottom panel: the grid -->
  <rect x="24" y="304" width="652" height="226" rx="10" fill="none" stroke="#d9480f" stroke-width="2.5"/>
  <text x="48" y="340" font-size="22" font-weight="600" fill="#b93c08">the grid</text>

  <text x="110" y="384" text-anchor="middle" font-size="22" fill="#222">production</text>
  <text x="280" y="384" text-anchor="middle" font-size="22" fill="#222">distribution</text>
  <text x="450" y="384" text-anchor="middle" font-size="22" fill="#222">consumption</text>
  <text x="600" y="384" text-anchor="middle" font-size="22" fill="#5f646d">appliances</text>

  <g stroke="#d9480f" stroke-width="2.5" fill="none">
    <!-- verticals -->
    <line x1="110" y1="430" x2="110" y2="476"/>
    <line x1="280" y1="430" x2="280" y2="476"/>
    <line x1="450" y1="430" x2="450" y2="476"/>
    <!-- cross-links -->
    <line x1="122" y1="424" x2="268" y2="482"/>
    <line x1="122" y1="482" x2="268" y2="424"/>
    <line x1="292" y1="424" x2="438" y2="482"/>
    <line x1="292" y1="482" x2="438" y2="424"/>
    <!-- straight links with flow direction -->
    <line x1="126" y1="416" x2="264" y2="416" marker-end="url(#ah)"/>
    <line x1="126" y1="490" x2="264" y2="490" marker-end="url(#ah)"/>
    <line x1="296" y1="416" x2="434" y2="416" marker-end="url(#ah)"/>
    <line x1="296" y1="490" x2="434" y2="490" marker-end="url(#ah)"/>
  </g>
  <g fill="#d9480f">
    <circle cx="110" cy="416" r="14"/><circle cx="110" cy="490" r="14"/>
    <circle cx="280" cy="416" r="14"/><circle cx="280" cy="490" r="14"/>
    <circle cx="450" cy="416" r="14"/><circle cx="450" cy="490" r="14"/>
  </g>

  <!-- appliances, connected only at consumption -->
  <g stroke="#222" stroke-width="2.5" fill="none">
    <line x1="466" y1="416" x2="572" y2="416" marker-end="url(#ahk)"/>
    <line x1="466" y1="490" x2="572" y2="490" marker-end="url(#ahk)"/>
    <!-- bulb -->
    <circle cx="594" cy="412" r="14"/>
    <path d="M588 425 v8 h12 v-8"/>
    <!-- screen -->
    <rect x="576" y="476" width="44" height="28" rx="10"/>
    <line x1="590" y1="512" x2="606" y2="512"/>
  </g>

  <!-- Footer -->
  <text x="350" y="568" text-anchor="middle" font-size="22" fill="#222">The grid is important, not the use cases.</text>
</svg>
