<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" width="700" height="530" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The system of integration</title>
  <desc>Three boxes side by side: systems of record (raw data, aggregated data), systems of intelligence (hundreds of models) and systems of interaction (website, app, DigiYatra terminal). Each box connects by a line down into an orange band below them, the system of integration. A note tied to the band maps it to the human body: brain is intelligence; nervous system and blood are integration. Footer: without it, we are organs not talking to each other.</desc>
  <rect width="700" height="530" fill="#fafaf7"/>

  <!-- three system boxes -->
  <g fill="#ffffff" stroke="#222" stroke-width="2">
    <rect x="24" y="24" width="204" height="206" rx="10"/>
    <rect x="248" y="24" width="204" height="206" rx="10"/>
    <rect x="472" y="24" width="204" height="206" rx="10"/>
  </g>
  <g font-size="22" font-weight="600" text-anchor="middle">
    <text x="126" y="62" fill="#222">Systems of</text>
    <text x="126" y="90" fill="#222">record</text>
    <text x="350" y="62" fill="#222">Systems of</text>
    <text x="350" y="90" fill="#222">intelligence</text>
    <text x="574" y="62" fill="#222">Systems of</text>
    <text x="574" y="90" fill="#222">interaction</text>
  </g>
  <g font-size="22" text-anchor="middle">
    <text x="126" y="140" fill="#5f646d">raw data,</text>
    <text x="126" y="168" fill="#5f646d">aggregated data</text>
    <text x="350" y="140" fill="#5f646d">hundreds</text>
    <text x="350" y="168" fill="#5f646d">of models</text>
    <text x="574" y="140" fill="#5f646d">website, app,</text>
    <text x="574" y="168" fill="#5f646d">DigiYatra</text>
    <text x="574" y="196" fill="#5f646d">terminal</text>
  </g>

  <!-- connectors from each box into the band -->
  <g stroke="#d9480f" stroke-width="2.5">
    <line x1="126" y1="230" x2="126" y2="270"/>
    <line x1="350" y1="230" x2="350" y2="270"/>
    <line x1="574" y1="230" x2="574" y2="270"/>
  </g>
  <g fill="#d9480f">
    <circle cx="126" cy="230" r="6"/>
    <circle cx="350" cy="230" r="6"/>
    <circle cx="574" cy="230" r="6"/>
  </g>

  <!-- system of integration band -->
  <rect x="24" y="270" width="652" height="60" rx="10" fill="#d9480f"/>
  <text x="350" y="308" font-size="24" font-weight="700" text-anchor="middle" fill="#fafaf7">System of integration</text>

  <!-- human body note -->
  <line x1="350" y1="330" x2="350" y2="370" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="104" y="370" width="492" height="94" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <g font-size="22" text-anchor="middle">
    <text x="350" y="407" fill="#222"><tspan font-weight="600">brain</tspan> = intelligence;</text>
    <text x="350" y="441" fill="#222"><tspan font-weight="600">nervous system and blood</tspan> = <tspan fill="#b93c08" font-weight="600">integration</tspan></text>
  </g>

  <text x="350" y="502" font-size="22" text-anchor="middle" fill="#5f646d">Without it, we are organs not talking to each other.</text>
</svg>
