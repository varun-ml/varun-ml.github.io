<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 466" width="700" height="466" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Mother Teresa or Buddha: services or platform</title>
  <desc id="d">Three qualities of a great innovator: find the right problem, decide first and learn second, solve it for everyone. Below, two columns. Left, Mother Teresa, services: one use case at a time, one person at a time; for example Infosys, Wipro, TCS, one use case for one bank, another for another bank. Right, highlighted, Buddha, platform: solve it for everyone, forever; for example Claude Code, all programming problems, for everyone.</desc>
  <rect width="700" height="466" fill="#fafaf7"/>

  <!-- three qualities -->
  <text x="24" y="44" font-size="22" fill="#5f646d">1. Find the right problem</text>
  <text x="24" y="78" font-size="22" fill="#5f646d">2. Decide first, learn second</text>
  <text x="24" y="112" font-size="22" font-weight="700" fill="#b93c08">3. Solve it for everyone</text>

  <!-- Mother Teresa: services -->
  <rect x="24" y="136" width="314" height="306" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="181" y="178" text-anchor="middle" font-size="26" font-weight="700" fill="#222">Mother Teresa</text>
  <text x="181" y="210" text-anchor="middle" font-size="22" fill="#5f646d">services</text>
  <line x1="44" y1="230" x2="318" y2="230" stroke="#8a8f98" stroke-width="1"/>
  <text x="181" y="266" text-anchor="middle" font-size="22" fill="#222">One use case at a time,</text>
  <text x="181" y="296" text-anchor="middle" font-size="22" fill="#222">one person at a time</text>
  <text x="181" y="346" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Infosys, Wipro, TCS</text>
  <text x="181" y="378" text-anchor="middle" font-size="22" fill="#5f646d">one use case for one bank,</text>
  <text x="181" y="408" text-anchor="middle" font-size="22" fill="#5f646d">another for another bank</text>

  <!-- Buddha: platform (accent) -->
  <rect x="362" y="136" width="314" height="306" rx="10" fill="#fdebe2" stroke="#d9480f" stroke-width="2.5"/>
  <text x="519" y="178" text-anchor="middle" font-size="26" font-weight="700" fill="#b93c08">Buddha</text>
  <text x="519" y="210" text-anchor="middle" font-size="22" fill="#b93c08">platform</text>
  <line x1="382" y1="230" x2="656" y2="230" stroke="#d9480f" stroke-width="1"/>
  <text x="519" y="266" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Solve it for everyone,</text>
  <text x="519" y="296" text-anchor="middle" font-size="22" font-weight="600" fill="#222">forever</text>
  <text x="519" y="346" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Claude Code</text>
  <text x="519" y="378" text-anchor="middle" font-size="22" fill="#5f646d">all programming problems,</text>
  <text x="519" y="408" text-anchor="middle" font-size="22" fill="#5f646d">for everyone</text>
</svg>
