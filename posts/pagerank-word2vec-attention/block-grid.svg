<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 400" width="990" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Three algorithms, one saying</title>
<desc id="d">A fourth, dashed column holds a question mark in every cell. An arrow chain runs from the saying "you are defined by the company you keep" to PageRank, then word2vec, then Attention. Below, a grid with one column per algorithm and three rows. Company: links, words in a window, words chosen by attention. Output: a score, a vector, a vector per sentence. Solver: power iteration, SGD, a network trained end to end. In the word2vec and Attention columns, cells that changed from the previous column are highlighted.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="990" height="400" fill="#fafaf7"/>
<rect x="10" y="18" width="150" height="66" rx="6" fill="#fafaf7" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="85" y="39" font-size="15" font-style="italic" fill="#222" text-anchor="middle">“you are defined</text>
<text x="85" y="58" font-size="15" font-style="italic" fill="#222" text-anchor="middle">by the company</text>
<text x="85" y="77" font-size="15" font-style="italic" fill="#222" text-anchor="middle">you keep”</text>
<line x1="163" y1="51" x2="187" y2="51" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="190" y="31" width="180" height="40" rx="6" fill="#222"/>
<text x="280.0" y="57" font-size="18" font-weight="700" fill="#fafaf7" text-anchor="middle">PageRank</text>
<line x1="373" y1="51" x2="392" y2="51" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="395" y="31" width="180" height="40" rx="6" fill="#222"/>
<text x="485.0" y="57" font-size="18" font-weight="700" fill="#fafaf7" text-anchor="middle">word2vec</text>
<line x1="578" y1="51" x2="597" y2="51" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="600" y="31" width="180" height="40" rx="6" fill="#222"/>
<text x="690.0" y="57" font-size="18" font-weight="700" fill="#fafaf7" text-anchor="middle">Attention</text>
<text x="160" y="140" font-size="17" font-weight="700" fill="#222" text-anchor="end">company</text>
<rect x="190" y="100" width="180" height="70" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
<text x="280.0" y="140" font-size="16" fill="#222" text-anchor="middle">links</text>
<rect x="395" y="100" width="180" height="70" rx="6" fill="#fbe6dc" stroke="#d9480f" stroke-width="2.5"/>
<text x="485.0" y="140" font-size="16" fill="#222" text-anchor="middle">words in a window</text>
<rect x="600" y="100" width="180" height="70" rx="6" fill="#fbe6dc" stroke="#d9480f" stroke-width="2.5"/>
<text x="690.0" y="131" font-size="16" fill="#222" text-anchor="middle">words chosen</text>
<text x="690.0" y="151" font-size="16" fill="#222" text-anchor="middle">by attention</text>
<text x="160" y="225" font-size="17" font-weight="700" fill="#222" text-anchor="end">output</text>
<rect x="190" y="185" width="180" height="70" rx="6" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2"/>
<text x="280.0" y="225" font-size="16" fill="#222" text-anchor="middle">a score</text>
<rect x="395" y="185" width="180" height="70" rx="6" fill="#fbe6dc" stroke="#d9480f" stroke-width="2.5"/>
<text x="485.0" y="225" font-size="16" fill="#222" text-anchor="middle">a vector</text>
<rect x="600" y="185" width="180" height="70" rx="6" fill="#fbe6dc" stroke="#d9480f" stroke-width="2.5"/>
<text x="690.0" y="216" font-size="16" fill="#222" text-anchor="middle">a vector</text>
<text x="690.0" y="236" font-size="16" fill="#222" text-anchor="middle">per sentence</text>
<text x="160" y="310" font-size="17" font-weight="700" fill="#222" text-anchor="end">solver</text>
