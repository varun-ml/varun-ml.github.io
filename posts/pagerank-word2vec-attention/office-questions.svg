<title id="t">A question moves through the office</title>
<desc id="d">An office floor plan with desks for Kevin, Oscar, Dwight, Angela, one unnamed desk and Pam in the middle. An orange arrow shows a question starting at Kevin, going to Oscar, then to Pam. Grey arrows from Dwight, Angela and the unnamed desk also point to Pam. Dots on each desk show how many questions that person was handed: one or two each, and many for Pam. Illustrative, no real data.</desc>
