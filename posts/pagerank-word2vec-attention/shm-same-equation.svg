<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 670" width="700" height="670" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The same equation in four places</title>
<desc id="d">Four panels: a pendulum, a mass on a spring, a sound wave, and an atom vibrating between neighbours in a crystal. Each has a short double-headed arrow for the small move around equilibrium, and the same label under it: simple harmonic motion, F = -kx.</desc>
<defs><marker id="aE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="aS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d9480f"/></marker></defs>
<rect width="700" height="670" fill="#fafaf7"/>
<line x1="350" y1="20" x2="350" y2="650" stroke="#8a8f98" stroke-width="1" opacity="0.5"/><line x1="20" y1="335" x2="680" y2="335" stroke="#8a8f98" stroke-width="1" opacity="0.5"/>
<text x="175.0" y="40.0" font-size="24" fill="#222" text-anchor="middle" font-weight="normal">pendulum</text>
<g transform="translate(55,10)"><line x1="80" y1="70" x2="160" y2="70" stroke="#222" stroke-width="3"/>
<line x1="120" y1="70" x2="96" y2="195" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="120" y1="70" x2="144" y2="195" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="96" cy="195" r="13" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="144" cy="195" r="13" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="120" y1="70" x2="120" y2="198" stroke="#222" stroke-width="2"/><circle cx="120" cy="198" r="15" fill="#222"/>
<line x1="94" y1="232" x2="146" y2="232" stroke="#d9480f" stroke-width="3" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
<text x="175.0" y="284.0" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">simple harmonic motion</text>
<text x="175.0" y="316.0" font-size="24" fill="#b93c08" text-anchor="middle" font-weight="normal" font-style="italic">F = −kx</text>
<text x="525.0" y="40.0" font-size="24" fill="#222" text-anchor="middle" font-weight="normal">spring</text>
<g transform="translate(405,10)"><line x1="30" y1="120" x2="30" y2="195" stroke="#222" stroke-width="3"/><line x1="30" y1="195" x2="210" y2="195" stroke="#222" stroke-width="2"/>
<polyline points="30,165 50,165 57,150 71,180 85,150 99,180 113,150 120,165 135,165" fill="none" stroke="#222" stroke-width="2"/>
<rect x="135" y="140" width="50" height="50" fill="#222"/><line x1="132" y1="112" x2="188" y2="112" stroke="#d9480f" stroke-width="3" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
<text x="525.0" y="284.0" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">simple harmonic motion</text>
<text x="525.0" y="316.0" font-size="24" fill="#b93c08" text-anchor="middle" font-weight="normal" font-style="italic">F = −kx</text>
<text x="175.0" y="380.0" font-size="24" fill="#222" text-anchor="middle" font-weight="normal">sound wave</text>
<g transform="translate(55,350)"><line x1="25" y1="150" x2="215" y2="150" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 4"/>
<path d="M30,150 C50,100 70,100 90,150 S130,200 150,150 S190,100 210,150" fill="none" stroke="#222" stroke-width="2.5"/><line x1="60" y1="148" x2="60" y2="110" stroke="#d9480f" stroke-width="3" marker-start="url(#aS)" marker-end="url(#aE)"/></g>
<text x="175.0" y="624.0" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">simple harmonic motion</text>
<text x="175.0" y="656.0" font-size="24" fill="#b93c08" text-anchor="middle" font-weight="normal" font-style="italic">F = −kx</text>
<text x="525.0" y="380.0" font-size="24" fill="#222" text-anchor="middle" font-weight="normal">atom in a crystal</text>
