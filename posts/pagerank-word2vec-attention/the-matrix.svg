<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 260" width="790" height="260" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">One matrix, four levels</title>
<desc id="d">Four boxes in a row. PageRank: M is given, r = M r. word2vec: M is learned, M = W C transposed. Attention: M is computed from the input, M_ij = softmax of q_i dot k_j. The fourth box is dashed and holds a question mark: M gets structure, or a learning rule.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="790" height="260" fill="#fafaf7"/>
<text x="395" y="34" font-size="17" font-weight="700" fill="#222" text-anchor="middle">What happens to the matrix M</text>
<rect x="20" y="60" width="175" height="150" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6" />
<text x="107.5" y="90" font-size="18" font-weight="700" fill="#222" text-anchor="middle">PageRank</text>
<text x="107.5" y="124" font-size="15" fill="#d9480f" font-weight="700" text-anchor="middle">M is given</text>
<text x="107.5" y="154" font-size="16" fill="#222" text-anchor="middle">r = M r</text>
<text x="107.5" y="182" font-size="14" fill="#8a8f98" text-anchor="middle">1/outlinks</text>
<line x1="197" y1="135" x2="212" y2="135" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="215" y="60" width="175" height="150" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6" />
<text x="302.5" y="90" font-size="18" font-weight="700" fill="#222" text-anchor="middle">word2vec</text>
<text x="302.5" y="124" font-size="15" fill="#d9480f" font-weight="700" text-anchor="middle">M is learned</text>
<text x="302.5" y="154" font-size="16" fill="#222" text-anchor="middle">M ≈ W Cᵀ</text>
<text x="302.5" y="182" font-size="14" fill="#8a8f98" text-anchor="middle">Mᵢⱼ = wᵢ · cⱼ</text>
<line x1="392" y1="135" x2="407" y2="135" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="410" y="60" width="175" height="150" rx="8" fill="#ffffff" stroke="#222" stroke-width="1.6" />
<text x="497.5" y="90" font-size="18" font-weight="700" fill="#222" text-anchor="middle">Attention</text>
<text x="497.5" y="124" font-size="15" fill="#d9480f" font-weight="700" text-anchor="middle">M is computed</text>
<text x="497.5" y="154" font-size="16" fill="#222" text-anchor="middle">Mᵢⱼ = softmax(qᵢ · kⱼ)</text>
<text x="497.5" y="182" font-size="14" fill="#8a8f98" text-anchor="middle">per input</text>
<line x1="587" y1="135" x2="602" y2="135" stroke="#222" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="605" y="60" width="175" height="150" rx="8" fill="#fafaf7" stroke="#222" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="692.5" y="90" font-size="18" font-weight="700" fill="#222" text-anchor="middle">?</text>
<text x="692.5" y="124" font-size="15" fill="#d9480f" font-weight="700" text-anchor="middle">M gets structure,</text>
<text x="692.5" y="154" font-size="16" fill="#222" text-anchor="middle">or a learning rule</text>
<text x="692.5" y="182" font-size="14" fill="#8a8f98" text-anchor="middle"></text>
<text x="395" y="243" font-size="14" fill="#8a8f98" text-anchor="middle">given → learned → computed → ?</text>
</svg>
