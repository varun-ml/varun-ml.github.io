<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 388" width="700" height="388" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The saying drawn as a table</title>
<desc id="d">Rows are things: tea, coffee, carburettor. Columns are their company: cup, drank, morning, engine. Tea and coffee have big dots under cup, drank and morning. Carburettor has a big dot only under engine. Dot size shows how often the two appear together; no counts are shown.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker></defs>
<rect width="700" height="388" fill="#fafaf7"/>
<text x="434" y="30" font-size="22" fill="#5f646d" text-anchor="middle" font-weight="normal">their company</text>
<text x="251.0" y="62" font-size="22" fill="#222" text-anchor="middle" font-weight="600">cup</text>
<text x="373.0" y="62" font-size="22" fill="#222" text-anchor="middle" font-weight="600">drank</text>
<text x="495.0" y="62" font-size="22" fill="#222" text-anchor="middle" font-weight="600">morning</text>
<text x="617.0" y="62" font-size="22" fill="#222" text-anchor="middle" font-weight="600">engine</text>
<rect x="190" y="70" width="488" height="258" rx="10" fill="#fff" stroke="#8a8f98" stroke-width="1.5"/>
<line x1="312" y1="70" x2="312" y2="328" stroke="#8a8f98" stroke-width="1"/>
<line x1="434" y1="70" x2="434" y2="328" stroke="#8a8f98" stroke-width="1"/>
<line x1="556" y1="70" x2="556" y2="328" stroke="#8a8f98" stroke-width="1"/>
<line x1="190" y1="156" x2="678" y2="156" stroke="#8a8f98" stroke-width="1"/>
<line x1="190" y1="242" x2="678" y2="242" stroke="#8a8f98" stroke-width="1"/>
<text x="176" y="121.0" font-size="22" fill="#222" text-anchor="end" font-weight="600">tea</text>
<circle cx="251.0" cy="113.0" r="24" fill="#d9480f"/>
<circle cx="373.0" cy="113.0" r="24" fill="#d9480f"/>
<circle cx="495.0" cy="113.0" r="24" fill="#d9480f"/>
<circle cx="617.0" cy="113.0" r="4" fill="#8a8f98"/>
<text x="176" y="207.0" font-size="22" fill="#222" text-anchor="end" font-weight="600">coffee</text>
<circle cx="251.0" cy="199.0" r="24" fill="#d9480f"/>
<circle cx="373.0" cy="199.0" r="24" fill="#d9480f"/>
<circle cx="495.0" cy="199.0" r="24" fill="#d9480f"/>
<circle cx="617.0" cy="199.0" r="4" fill="#8a8f98"/>
<text x="176" y="293.0" font-size="22" fill="#222" text-anchor="end" font-weight="600">carburettor</text>
<circle cx="251.0" cy="285.0" r="4" fill="#8a8f98"/>
<circle cx="373.0" cy="285.0" r="4" fill="#8a8f98"/>
<circle cx="495.0" cy="285.0" r="4" fill="#8a8f98"/>
<circle cx="617.0" cy="285.0" r="24" fill="#d9480f"/>
<text x="350" y="370" font-size="22" fill="#5f646d" text-anchor="middle" font-weight="normal">bigger dot = they appear together more often</text>
