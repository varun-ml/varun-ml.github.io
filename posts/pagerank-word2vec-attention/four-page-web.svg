<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The four-page web after PageRank</title>
<desc id="d">A directed graph of four pages. Arrows: page 0 to page 1, page 0 to page 2, page 1 to page 2, page 2 to page 0, page 3 to page 2. Circle area is proportional to the settled score: page 2 is 0.394, page 0 is 0.373, page 1 is 0.196, page 3 is 0.038.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<rect width="700" height="460" fill="#fafaf7"/>
<path d="M242.2,143.4 Q330.0,120.0 414.3,142.5" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-ink)"/>
<path d="M416.2,177.0 Q330.0,200.0 244.1,177.1" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-ink)"/>
<path d="M224.0,206.9 L296.0,283.7" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-ink)"/>
<path d="M362.6,285.2 L433.5,209.6" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-ink)"/>
<path d="M586.8,315.8 L518.5,216.1" fill="none" stroke="#222" stroke-width="2.5" marker-end="url(#a-ink)"/>
<circle cx="180" cy="160" r="60.3" fill="#e4e2da" stroke="#222" stroke-width="2"/>
<circle cx="330" cy="320" r="43.7" fill="#e4e2da" stroke="#222" stroke-width="2"/>
<circle cx="480" cy="160" r="62.0" fill="#d9480f" stroke="#222" stroke-width="2"/>
<circle cx="600" cy="335" r="19.3" fill="#e4e2da" stroke="#222" stroke-width="2"/>
<text x="180.0" y="85.7" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">page 0: 0.373</text>
<text x="480.0" y="84.0" font-size="22" fill="#b93c08" text-anchor="middle" font-weight="600">page 2: 0.394</text>
<text x="330.0" y="395.7" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">page 1: 0.196</text>
<text x="600.0" y="386.3" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">page 3: 0.038</text>
