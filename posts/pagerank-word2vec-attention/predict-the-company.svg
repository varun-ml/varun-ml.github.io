<title id="t">Predict the company, round by round</title>
<desc id="d">Four panels of the same 2-number plane at rounds 0, 1, 5 and 50. Grey squares are the company words, fixed in place: drank (0, 1), cup (1, 0), engine (-1, -1). Tea (filled orange circle) starts at (1, -1), coffee (orange ring) at (-1, 1) and the carburettor (dark circle) at (1, 1). Round 1: tea (1.47, -0.28), coffee (-0.29, 1.51), carburettor (0.24, 0.56). Round 5: tea (2.13, 0.96), coffee (0.95, 2.18), carburettor (-1.29, -0.29). Round 50: tea (3.54, 3.25) and coffee (3.25, 3.56) side by side, the carburettor at (-3.54, -1.07), out past engine.</desc>
