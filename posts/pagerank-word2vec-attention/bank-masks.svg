<text x="222.0" y="420.0" font-size="24" fill="#222" text-anchor="middle" font-weight="400">took</text>
<text x="350.0" y="420.0" font-size="24" fill="#222" text-anchor="middle" font-weight="400">a</text>
<text x="478.0" y="420.0" font-size="24" fill="#222" text-anchor="middle" font-weight="600">bank</text>
<text x="606.0" y="420.0" font-size="24" fill="#222" text-anchor="middle" font-weight="400">loan</text>
<text x="606.0" y="388.0" font-size="22" fill="#b93c08" text-anchor="middle" font-weight="600">0.43</text>
<rect x="300" y="510" width="100" height="40" rx="10" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="350.0" y="538.0" font-size="24" fill="#222" text-anchor="middle" font-weight="600">bank</text>
<line x1="120" y1="618" x2="580" y2="618" stroke="#8a8f98" stroke-width="2.5"/>
<text x="108.0" y="626.0" font-size="22" fill="#5f646d" text-anchor="end" font-weight="400">river</text>
<text x="592.0" y="626.0" font-size="22" fill="#5f646d" text-anchor="start" font-weight="400">money</text>
<text x="350.0" y="598.0" font-size="22" fill="#5f646d" text-anchor="middle" font-weight="400">word2vec's bank</text>
<line x1="362.0" y1="618" x2="474.2" y2="618" stroke="#d9480f" stroke-width="2.5" marker-end="url(#ha)"/>
<circle cx="350.0" cy="618" r="9" fill="#fafaf7" stroke="#222" stroke-width="2.5"/>
<circle cx="488.2" cy="618" r="10" fill="#d9480f"/>
<text x="488.2" y="658.0" font-size="22" fill="#b93c08" text-anchor="middle" font-weight="600">bank in this sentence</text>
</svg>
