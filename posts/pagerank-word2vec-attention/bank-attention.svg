<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Attention gives 'bank' different company in each sentence</title>
<desc id="d">Two sentences. In 'we walked along the river bank', lines run from 'bank' to every other word; the thickest line goes to 'river'. In 'she took a bank loan last year', the thickest line from 'bank' goes to 'loan'. Thin lines go to the other words. Line thickness shows attention weight; no numbers are given. Each 'bank' output vector is drawn as a strip of cells, and the two strips differ. Note: the new 'bank' vector is a softmax over scores, then a weighted sum.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker></defs>
<rect width="700" height="470" fill="#fafaf7"/>
<text x="24" y="24" font-size="15" fill="#8a8f98">Sentence 1</text>
<path d="M425 126 Q238 -69 50 126" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M425 126 Q275 -36 125 126" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M425 126 Q316 1 208 126" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M425 126 Q350 30 275 126" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M425 126 Q385 61 345 126" fill="none" stroke="#d9480f" stroke-width="7" stroke-linecap="round"/>
<text x="385" y="176" font-size="15" fill="#d9480f" text-anchor="middle" font-weight="600">heavy weight</text>
<text x="50" y="150" font-size="20" text-anchor="middle" fill="#8a8f98">we</text>
<text x="125" y="150" font-size="20" text-anchor="middle" fill="#8a8f98">walked</text>
<text x="208" y="150" font-size="20" text-anchor="middle" fill="#8a8f98">along</text>
<text x="275" y="150" font-size="20" text-anchor="middle" fill="#8a8f98">the</text>
<text x="345" y="150" font-size="20" text-anchor="middle" fill="#d9480f" font-weight="700">river</text>
<text x="425" y="150" font-size="20" text-anchor="middle" fill="#222" font-weight="700">bank</text>
<line x1="470" y1="144" x2="528" y2="144" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="600" y="116" font-size="15" fill="#222" text-anchor="middle">'bank' out</text>
<rect x="540" y="130" width="20" height="20" fill="#222" fill-opacity="0.85" stroke="#fafaf7" stroke-width="2"/>
<rect x="560" y="130" width="20" height="20" fill="#222" fill-opacity="0.2" stroke="#fafaf7" stroke-width="2"/>
<rect x="580" y="130" width="20" height="20" fill="#222" fill-opacity="0.6" stroke="#fafaf7" stroke-width="2"/>
<rect x="600" y="130" width="20" height="20" fill="#222" fill-opacity="0.1" stroke="#fafaf7" stroke-width="2"/>
<rect x="620" y="130" width="20" height="20" fill="#222" fill-opacity="0.9" stroke="#fafaf7" stroke-width="2"/>
<rect x="640" y="130" width="20" height="20" fill="#222" fill-opacity="0.35" stroke="#fafaf7" stroke-width="2"/>
<text x="24" y="214" font-size="15" fill="#8a8f98">Sentence 2</text>
<path d="M230 316 Q140 207 50 316" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M230 316 Q172 235 115 316" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M230 316 Q200 260 170 316" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M230 316 Q265 255 300 316" fill="none" stroke="#d9480f" stroke-width="7" stroke-linecap="round"/>
<text x="265" y="366" font-size="15" fill="#d9480f" text-anchor="middle" font-weight="600">heavy weight</text>
<path d="M230 316 Q300 224 370 316" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<path d="M230 316 Q335 194 440 316" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<text x="50" y="340" font-size="20" text-anchor="middle" fill="#8a8f98">she</text>
<text x="115" y="340" font-size="20" text-anchor="middle" fill="#8a8f98">took</text>
<text x="170" y="340" font-size="20" text-anchor="middle" fill="#8a8f98">a</text>
<text x="230" y="340" font-size="20" text-anchor="middle" fill="#222" font-weight="700">bank</text>
<text x="300" y="340" font-size="20" text-anchor="middle" fill="#d9480f" font-weight="700">loan</text>
<text x="370" y="340" font-size="20" text-anchor="middle" fill="#8a8f98">last</text>
<text x="440" y="340" font-size="20" text-anchor="middle" fill="#8a8f98">year</text>
<line x1="470" y1="334" x2="528" y2="334" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="600" y="306" font-size="15" fill="#222" text-anchor="middle">'bank' out</text>
<rect x="540" y="320" width="20" height="20" fill="#222" fill-opacity="0.15" stroke="#fafaf7" stroke-width="2"/>
<rect x="560" y="320" width="20" height="20" fill="#222" fill-opacity="0.75" stroke="#fafaf7" stroke-width="2"/>
<rect x="580" y="320" width="20" height="20" fill="#222" fill-opacity="0.3" stroke="#fafaf7" stroke-width="2"/>
<rect x="600" y="320" width="20" height="20" fill="#222" fill-opacity="0.95" stroke="#fafaf7" stroke-width="2"/>
<rect x="620" y="320" width="20" height="20" fill="#222" fill-opacity="0.2" stroke="#fafaf7" stroke-width="2"/>
<rect x="640" y="320" width="20" height="20" fill="#222" fill-opacity="0.6" stroke="#fafaf7" stroke-width="2"/>
<text x="600" y="232" font-size="30" fill="#d9480f" text-anchor="middle" font-weight="700">&#8800;</text>
<text x="600" y="256" font-size="15" fill="#222" text-anchor="middle">two different vectors</text>
<line x1="24" y1="388" x2="676" y2="388" stroke="#e3e3dc" stroke-width="1"/>
<line x1="28" y1="420" x2="78" y2="420" stroke="#d9480f" stroke-width="7" stroke-linecap="round"/>
<text x="90" y="426" font-size="16" fill="#222">heavy weight</text>
<line x1="220" y1="420" x2="270" y2="420" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round"/>
<text x="282" y="426" font-size="16" fill="#222">light weight</text>
<text x="24" y="456" font-size="16" fill="#222">New 'bank' vector: <tspan fill="#d9480f" font-weight="600">softmax over scores, weighted sum</tspan> of the words</text>
</svg>
