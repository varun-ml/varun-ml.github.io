<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 808" width="700" height="808" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"><title>One session</title><desc>Charter, invariants, a driver on the live system, one listening point, checks on the log, ISSUES.md with the log as the bug report, then fix and re-drive.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="700" height="808" fill="#fafaf7"/><rect x="20" y="20" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="56.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Charter</text><text x="350.0" y="86.0" text-anchor="middle" font-size="22" fill="#5f646d">4–6 things you will actually do</text><line x1="350" y1="104" x2="350" y2="132" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="134" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="170.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Invariants, agreed up front</text><text x="350.0" y="200.0" text-anchor="middle" font-size="22" fill="#5f646d">rules a machine can check</text><line x1="350" y1="218" x2="350" y2="246" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="248" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="284.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Use the live product</text><text x="350.0" y="314.0" text-anchor="middle" font-size="22" fill="#5f646d">a person, or the agent itself</text><line x1="350" y1="332" x2="350" y2="360" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="362" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="398.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Listen at one point</text><text x="350.0" y="428.0" text-anchor="middle" font-size="22" fill="#5f646d">copy every message there into a log</text><line x1="350" y1="446" x2="350" y2="474" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="476" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="512.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Checks run on the log</text><text x="350.0" y="542.0" text-anchor="middle" font-size="22" fill="#5f646d">rules, plus agents that read or look</text><line x1="350" y1="560" x2="350" y2="588" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="590" width="660" height="84" rx="10" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/><text x="350.0" y="626.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#b93c08">ISSUES.md + the log</text><text x="350.0" y="656.0" text-anchor="middle" font-size="22" fill="#5f646d">this is the bug report</text><line x1="350" y1="674" x2="350" y2="702" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="704" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="740.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Fix, then run it again</text><text x="350.0" y="770.0" text-anchor="middle" font-size="22" fill="#5f646d">the same steps, on the new build</text></svg>