<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"><title>Test the checker before you trust it</title><desc>A planted bug must fire. A clean stream must stay quiet. An empty ISSUES.md means nothing until both pass.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="700" height="300" fill="#fafaf7"/><rect x="20" y="20" width="170" height="70" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="105.0" y="63.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Planted bug</text><line x1="190" y1="55" x2="218" y2="55" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="220" y="20" width="140" height="70" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="290.0" y="63.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">checker</text><line x1="360" y1="55" x2="388" y2="55" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="390" y="20" width="290" height="70" rx="10" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/><text x="535.0" y="63.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#b93c08">must write an issue</text><rect x="20" y="120" width="170" height="70" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="105.0" y="163.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Clean log</text><line x1="190" y1="155" x2="218" y2="155" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="220" y="120" width="140" height="70" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="290.0" y="163.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">checker</text><line x1="360" y1="155" x2="388" y2="155" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="390" y="120" width="290" height="70" rx="10" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/><text x="535.0" y="163.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#b93c08">must stay quiet</text><text x="350" y="250" font-size="22" fill="#b93c08" text-anchor="middle" font-weight="bold">An empty ISSUES.md means nothing</text><text x="350" y="280" font-size="22" fill="#b93c08" text-anchor="middle" font-weight="bold">until both pass.</text></svg>