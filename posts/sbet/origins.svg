<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"><title>Where it comes from</title><desc>1984 Kaner names exploratory testing; 1988 published; 2000 the Bachs add sessions with a charter; 2006 Kaner on automated exploration with checks; 2026 agents watch the session, then drive it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="700" height="350" fill="#fafaf7"/><line x1="120" y1="36" x2="120" y2="292" stroke="#222222" stroke-width="2.5"/><circle cx="120" cy="36" r="9" fill="#222222"/><text x="96" y="44" font-size="24" fill="#222222" text-anchor="end" font-weight="bold">1984</text><text x="144" y="44" font-size="22" fill="#222222" text-anchor="start">Kaner names exploratory testing</text><circle cx="120" cy="100" r="9" fill="#222222"/><text x="96" y="108" font-size="24" fill="#222222" text-anchor="end" font-weight="bold">1988</text><text x="144" y="108" font-size="22" fill="#222222" text-anchor="start">published in Testing Computer Software</text><circle cx="120" cy="164" r="9" fill="#222222"/><text x="96" y="172" font-size="24" fill="#222222" text-anchor="end" font-weight="bold">2000</text><text x="144" y="172" font-size="22" fill="#222222" text-anchor="start">the Bachs: sessions with a charter</text><circle cx="120" cy="228" r="9" fill="#222222"/><text x="96" y="236" font-size="24" fill="#222222" text-anchor="end" font-weight="bold">2006</text><text x="144" y="236" font-size="22" fill="#222222" text-anchor="start">Kaner: automated exploration + checks</text><circle cx="120" cy="292" r="9" fill="#d9480f"/><text x="96" y="300" font-size="24" fill="#b93c08" text-anchor="end" font-weight="bold">2026</text><text x="144" y="300" font-size="22" fill="#b93c08" text-anchor="start" font-weight="bold">agents watch the session, then drive it</text></svg>