<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"><title>From a session to a BVT</title><desc>A human explores while the machine watches; the agent re-drives the charter; each finding worth keeping becomes a scenario; run on every build, that list is a BVT, 30 scenarios from one session; a few quick checks are set up to run before a release.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="700" height="580" fill="#fafaf7"/><rect x="20" y="20" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="56.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">A person explores</text><text x="350.0" y="86.0" text-anchor="middle" font-size="22" fill="#5f646d">the machine checks</text><line x1="350" y1="104" x2="350" y2="132" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="134" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="170.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">The agent runs it again</text><text x="350.0" y="200.0" text-anchor="middle" font-size="22" fill="#5f646d">same list, same rules</text><line x1="350" y1="218" x2="350" y2="246" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="248" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="350.0" y="284.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Keep what&#x27;s worth keeping</text><text x="350.0" y="314.0" text-anchor="middle" font-size="22" fill="#5f646d">useful findings become test scenarios</text><line x1="350" y1="332" x2="350" y2="360" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="362" width="660" height="84" rx="10" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/><text x="350.0" y="398.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#b93c08">Kept as tests: the BVT</text><text x="350.0" y="428.0" text-anchor="middle" font-size="22" fill="#5f646d">30 scenarios from one session&#x27;s notes</text><line x1="350" y1="446" x2="350" y2="474" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><rect x="20" y="476" width="660" height="84" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5" stroke-dasharray="7 5"/><text x="350.0" y="512.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">Before a release</text><text x="350.0" y="542.0" text-anchor="middle" font-size="22" fill="#5f646d">a few quick checks, today</text></svg>