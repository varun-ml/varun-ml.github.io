<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif"><title>The question that was shown but never spoken</title><desc>Before: the question&#x27;s audio waits in the queue. A card with no audio skips the queue and shows at once. The pause-for-answer rule holds the queue, so the question is never spoken. After: the silent card waits its turn in the same queue.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect width="700" height="560" fill="#fafaf7"/><text x="20" y="40" font-size="24" fill="#222222" text-anchor="start" font-weight="bold">Before</text><text x="20" y="98" font-size="22" fill="#5f646d" text-anchor="start">Audio</text><rect x="130" y="66" width="170" height="54" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="215.0" y="101.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">earlier line</text><rect x="312" y="66" width="190" height="54" rx="10" fill="#fff1e6" stroke="#d9480f" stroke-width="2.5"/><text x="407.0" y="101.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#b93c08">the question</text><text x="20" y="178" font-size="22" fill="#5f646d" text-anchor="start">Board</text><rect x="130" y="146" width="240" height="54" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="250.0" y="181.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">card, no audio</text><path d="M504,93 C640,93 640,173 374,173" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="232" font-size="22" fill="#5f646d" text-anchor="start">skips the queue</text><text x="20" y="280" font-size="22" fill="#b93c08" text-anchor="start" font-weight="bold">The pause-for-answer rule holds the queue,</text><text x="20" y="310" font-size="22" fill="#b93c08" text-anchor="start" font-weight="bold">so the question is never spoken.</text><line x1="20" y1="338" x2="680" y2="338" stroke="#8a8f98" stroke-width="1.5"/><text x="20" y="380" font-size="24" fill="#222222" text-anchor="start" font-weight="bold">After</text><text x="20" y="438" font-size="22" fill="#5f646d" text-anchor="start">Audio</text><rect x="100" y="406" width="170" height="54" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="185.0" y="441.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">earlier line</text><rect x="280" y="406" width="190" height="54" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5"/><text x="375.0" y="441.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">the question</text><rect x="480" y="406" width="200" height="54" rx="10" fill="#fafaf7" stroke="#222222" stroke-width="2.5" stroke-dasharray="7 5"/><text x="580.0" y="441.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">silent card</text><text x="20" y="500" font-size="22" fill="#222222" text-anchor="start">The silent card waits its turn.</text><text x="20" y="530" font-size="22" fill="#222222" text-anchor="start">The question plays, then the card shows.</text></svg>